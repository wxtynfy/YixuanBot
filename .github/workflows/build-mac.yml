name: Build YixuanBot for Mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: unzip -q mac-source.zip -d source

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: astral-sh/setup-uv@v6

      - name: Build Apple Silicon installer
        run: |
          perl -pi -e 's/\r$//' source/scripts/build-mac.sh
          bash source/scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YixuanBot-mac-arm64
          path: source/release/*.dmg
          if-no-files-found: error
          retention-days: 7
