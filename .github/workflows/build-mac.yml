name: Build Exion bot for Mac
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          unzip -q mac-source.zip -d source
          cp build-mac-cross.sh source/scripts/build-mac-cross.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: astral-sh/setup-uv@v6
      - name: Cross-build and verify ARM dependencies
        env:
          UV_BREAK_SYSTEM_PACKAGES: 'true'
        run: |
          test "$(uname -m)" = x86_64
          bash source/scripts/build-mac-cross.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Exion-bot-0.1.7-mac-arm64
          path: |
            source/release/*.dmg
            source/release/SHA256.txt
          if-no-files-found: error
          retention-days: 14
